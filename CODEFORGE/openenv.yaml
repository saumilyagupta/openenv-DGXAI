name: code-forge
version: 0.2.0
description: >
  RL environment that forces LLM agents to produce truthful, verified,
  production-grade Python code. Every reward traces to real sandbox output,
  real AST grounding, and real skill corpus citations.

environment:
  class: codeforge.environment.CodeForgeEnvironment
  action_type: codeforge.models.CodeForgeAction
  observation_type: codeforge.models.CodeForgeObservation

server:
  host: 0.0.0.0
  port: 7860

tasks:
  - id: greet_single_file
    level: easy
    budget: 4
    target_score: 0.90
  - id: greet_with_tests
    level: medium
    budget: 6
    target_score: 0.80
  - id: multi_file_module
    level: hard
    budget: 10
    target_score: 0.70

actions:
  - query_kb
  - query_cluster
  - interrogate
  - run_ralph
  - submit
  - get_audit

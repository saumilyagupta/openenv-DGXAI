[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openrange-cyber-gym"
version = "0.1.0"
description = "OpenEnv-compliant Red vs Blue cybersecurity simulation environment."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openenv",
  "anthropic",
  "supabase",
  "python-dotenv",
  "fastapi",
  "uvicorn",
  "pydantic",
  "openai",
]


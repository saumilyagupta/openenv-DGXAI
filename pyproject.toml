[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epistemic-nav"
version = "0.1.0"
description = "RL environment for training agents to reason accurately under uncertainty."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openenv-core==0.2.1",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "rank_bm25==0.2.2",
    "numpy>=1.24.0",
    "httpx>=0.25.0",
]

[project.scripts]
server = "server.app:main"

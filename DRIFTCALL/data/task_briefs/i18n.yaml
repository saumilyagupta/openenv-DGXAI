# Localized lookup table for cities, weekdays, months, time-of-day phrases,
# and passenger labels used by task_generator. All values NFC-normalized.
# Keys are LanguageCode = {hi,ta,kn,en,hinglish}. City codes are IATA where
# applicable; otherwise domain-local neighborhood names. Every key that
# appears in any language MUST appear in every language (enforced by
# tests/test_data_consistency.py::test_i18n_keys_complete_across_langs).

